<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { color: #f0f6fc; }
    hr { border-color: #30363d; }
    code { background: #161b22; padding: 2px 6px; border-radius: 4px; color: #ff7b72; }
    pre { background: #161b22; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }
    .back-home { margin-bottom: 2rem; display: inline-block; }
  </style>
</head>
<body>
  <a href="{{ '/' | relative_url }}" class="back-home">← Back to Home</a>
  <main>
    {{ content }}
  </main>
</body>
</html>
