<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Blog</title>
  <style>
    /* Reset and Base Styles */
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 40px 20px;
      line-height: 1.6;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 { color: #f0f6fc; }
    hr { border-color: #30363d; margin: 2rem 0; }
    code { background: #161b22; padding: 2px 6px; border-radius: 4px; color: #ff7b72; font-size: 0.9em; }
    pre { background: #161b22; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }

    /* Header & Navigation Bar */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #30363d;
      margin-bottom: 30px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 1.2rem;
      color: #f0f6fc;
    }
    .header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #30363d;
      background-color: #161b22; /* Fallback color */
    }
    .site-nav {
      display: flex;
      gap: 20px;
    }
    .nav-link {
      color: #8b949e;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="header-brand">
      <!-- REPLACE avatar.jpg WITH YOUR IMAGE FILENAME LATER -->
      <img src="{{ '/avatar.jpg' | relative_url }}" alt="Logo" class="header-avatar" onerror="this.style.display='none'">
      <span>wsoula</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link">About</a>
      <a href="{{ '/contact/' | relative_url }}" class="nav-link">Contact</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
